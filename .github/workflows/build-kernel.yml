name: Build Moto G8 Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - 'android-13-release-ttz'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar o Código-Fonte
        uses: actions/checkout@v4

      - name: Instalar Dependências e Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libssl-dev libncurses5-dev bison flex libelf-dev libzip-dev clang gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 python-is-python3

      - name: Corrigir gcc-wrapper para Python 3
        run: |
          if [ -f scripts/gcc-wrapper.py ]; then
            printf '#!/usr/bin/env python3\nimport sys, subprocess\ncmd = sys.argv[1:]\nsys.exit(subprocess.call(cmd))\n' > scripts/gcc-wrapper.py
            chmod +x scripts/gcc-wrapper.py
          fi

      - name: Configurar e Compilar o Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KCFLAGS="-w"

          # Configura base do Snapdragon 665
          make O=out vendor/trinket-perf_defconfig

          # Aplica a configuração do Moto G8 (rav)
          if [ -f arch/arm64/configs/vendor/ext_config/moto-trinket-rav.config ]; then
            scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/ext_config/moto-trinket-rav.config
            make O=out olddefconfig
          fi

          # Executa a compilação
          make -j$(nproc) O=out

      - name: Compactar e Salvar o Resultado
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-MotoG8-rav
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export KCFLAGS="-w"

          # 1. Configura para trinket (Snapdragon 665)
          make O=out vendor/trinket-perf_defconfig

          # 2. Aplica a config do Moto G8 (rav)
          if [ -f arch/arm64/configs/vendor/ext_config/moto-trinket-rav.config ]; then
            scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/ext_config/moto-trinket-rav.config
            make O=out olddefconfig
          fi

          # 3. Compila
          make -j$(nproc) O=out

      - name: Compactar e Salvar o Resultado
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-MotoG8-rav
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img
            scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/ext_config/moto-trinket-rav.config
            make O=out olddefconfig
          fi

          # 3. Compila o Kernel
          make -j$(nproc) O=out

      - name: Compactar e Salvar o Resultado
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-MotoG8-rav
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img
          make O=out vendor/trinket-perf_defconfig

          # 2. Aplica a config do Moto G8 (rav)
          scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/ext_config/moto-trinket-rav.config
          make O=out olddefconfig

          # 3. Compila os binários
          make -j$(nproc) O=out

      - name: Compactar e Salvar o Resultado
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-MotoG8-rav
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img
          make O=out vendor/trinket-perf_defconfig

          # 2. Aplica a config do Moto G8 (rav)
          scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/ext_config/moto-trinket-rav.config
          make O=out olddefconfig

          # 3. Compila os binários
          make -j$(nproc) O=out

      - name: Compactar e Salvar o Resultado
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-MotoG8-rav
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img
          make O=out olddefconfig

          # 3. Compila os binários ignorando o gcc-wrapper se necessário
          make -j$(nproc) O=out

      - name: Compactar e Salvar o Resultado
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-MotoG8-rav
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img
