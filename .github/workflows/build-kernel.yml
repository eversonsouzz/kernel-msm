name: Build Moto G8 Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - 'android-13-release-ttz'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar o Codigo-Fonte
        uses: actions/checkout@v4

      - name: Instalar Dependencias Gerais
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libssl-dev libncurses5-dev bison flex libelf-dev libzip-dev git python3 python-is-python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Baixar Clang do AOSP (r383902 / Clang 11.0)
        run: |
          mkdir -p clang
          cd clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-11.0.0_r1/clang-r383902.tar.gz
          tar -xzf clang-r383902.tar.gz
          rm -f clang-r383902.tar.gz

      - name: Bypass no gcc-wrapper
        run: |
          if [ -f scripts/gcc-wrapper.py ]; then
            rm -f scripts/gcc-wrapper.py
            echo '#!/bin/sh' > scripts/gcc-wrapper.py
            echo 'exec "$@"' >> scripts/gcc-wrapper.py
            chmod +x scripts/gcc-wrapper.py
          fi

      - name: Configurar e Compilar o Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KCFLAGS="-w"

          # 1. Garante a criação da pasta de destion
          mkdir -p arch/arm64/configs

          # 2. Localiza dinamicamente o arquivo defconfig do trinket e copia
          SRC_DEFCONFIG=$(find . -type f \( -name "trinket-perf_defconfig" -o -name "trinket_defconfig" \) | head -n 1)
          cp "$SRC_DEFCONFIG" arch/arm64/configs/trinket_defconfig

          # 3. Concatena os fragmentos da Motorola diretamente no arquivo copiado
          MOTO_TRINKET=$(find . -type f -name "moto-trinket.config" | head -n 1)
          MOTO_RAV=$(find . -type f -name "moto-trinket-rav.config" | head -n 1)

          if [ -n "$MOTO_TRINKET" ]; then
            cat "$MOTO_TRINKET" >> arch/arm64/configs/trinket_defconfig
          fi
          if [ -n "$MOTO_RAV" ]; then
            cat "$MOTO_RAV" >> arch/arm64/configs/trinket_defconfig
          fi

          # 4. Carrega a configuração (agora o arquivo está 100% garantido em arch/arm64/configs/trinket_defconfig)
          make O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- trinket_defconfig

          # 5. Compilação do Kernel
          make -j$(nproc) O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Compactar e Salvar o Resultado
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-MotoG8-rav
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img
