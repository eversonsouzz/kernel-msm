name: Build Moto G8 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar o Codigo-Fonte
        uses: actions/checkout@v4
        with:
          repository: 'MotorolaMobilityLLC/kernel-msm'
          ref: 'MMI-RPJS31.Q4U-47-35-17'

      - name: Instalar Dependencias Gerais
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libssl-dev libncurses5-dev bison flex libelf-dev libzip-dev git python3 python-is-python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Baixar Clang do AOSP (r383902 / Clang 11.0)
        run: |
          mkdir -p clang
          cd clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-11.0.0_r1/clang-r383902.tar.gz
          tar -xzf clang-r383902.tar.gz
          rm -f clang-r383902.tar.gz

      - name: Bypass no gcc-wrapper
        run: |
          if [ -f scripts/gcc-wrapper.py ]; then
            rm -f scripts/gcc-wrapper.py
            echo '#!/bin/sh' > scripts/gcc-wrapper.py
            echo 'exec "$@"' >> scripts/gcc-wrapper.py
            chmod +x scripts/gcc-wrapper.py
          fi

      - name: Configurar e Compilar o Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KCFLAGS="-w"

          # Forçar o defconfig correto do Trinket (Moto G8 / Snapdragon 665)
          # Vamos procurar o arquivo exato dentro da árvore de configs
          CONFIG_TARGET=""
          for path in "vendor/trinket-perf_defconfig" "vendor/trinket_defconfig" "trinket-perf_defconfig" "trinket_defconfig"; do
            if [ -f "arch/arm64/configs/$path" ]; then
              CONFIG_TARGET="$path"
              break
            fi
          done

          # Se não achar na padrão, busca qualquer arquivo que contenha trinket e perf
          if [ -z "$CONFIG_TARGET" ]; then
            CONFIG_TARGET=$(find arch/arm64/configs -type f -name "*trinket*perf*" | head -n 1 | sed 's|arch/arm64/configs/||')
          fi

          if [ -z "$CONFIG_TARGET" ]; then
            echo "Erro: Defconfig do Trinket nao encontrado!"
            exit 1
          fi

          echo "Usando o arquivo de configuracao travado: arch/arm64/configs/$CONFIG_TARGET"

          # 1. Gerar o .config no diretório out/
          make O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- "$CONFIG_TARGET"

          # 2. Compilar o Kernel
          make -j$(nproc) O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Compactar e Salvar o Resultado
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-MotoG8-rav
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img
