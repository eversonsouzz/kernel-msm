name: Build Moto G8 (rav) Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o Código-Fonte
        uses: actions/checkout@v4
        with:
          ref: 'MMI-RPJS31.Q4U-47-35-17'

      - name: Configurar Python 2.7
        uses: actions/setup-python@v5
        with:
          python-version: '2.7'

      - name: Instalar Dependências e Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libssl-dev libncurses5-dev bison flex libelf-dev libzip-dev clang gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Configurar e Compilar o Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # Ignora warnings como erros no build
          export KCFLAGS="-w"

          # 1. Carrega a base do Snapdragon 665 (trinket)
          make O=out vendor/trinket-perf_defconfig

          # 2. Aplica a config do Moto G8 (rav)
          scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/ext_config/moto-trinket-rav.config
          make O=out olddefconfig

          # 3. Compila os binários
          make -j$(nproc) O=out

      - name: Compactar e Salvar o Resultado
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-MotoG8-rav
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img
          make O=out olddefconfig

          # 3. Compila os binários ignorando o gcc-wrapper se necessário
          make -j$(nproc) O=out

      - name: Compactar e Salvar o Resultado
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-MotoG8-rav
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img
