name: Build Moto G8 Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - 'android-13-release-ttz'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar o Codigo-Fonte
        uses: actions/checkout@v4

      - name: Instalar Dependencias Gerais
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libssl-dev libncurses5-dev bison flex libelf-dev libzip-dev git python3 python-is-python3

      - name: Baixar Toolchains GCC Oficiais do AOSP
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchain64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 toolchain32

      - name: Bypass no gcc-wrapper
        run: |
          if [ -f scripts/gcc-wrapper.py ]; then
            rm -f scripts/gcc-wrapper.py
            echo '#!/bin/sh' > scripts/gcc-wrapper.py
            echo 'exec "$@"' >> scripts/gcc-wrapper.py
            chmod +x scripts/gcc-wrapper.py
          fi

      - name: Configurar e Compilar o Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$(pwd)/toolchain64/bin:$(pwd)/toolchain32/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export KCFLAGS="-w"

          # Configura base do Snapdragon 665
          make O=out vendor/trinket-perf_defconfig

          # Aplica a configuracao do Moto G8 (rav)
          if [ -f arch/arm64/configs/vendor/ext_config/moto-trinket-rav.config ]; then
            scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/ext_config/moto-trinket-rav.config
            make O=out olddefconfig
          fi

          # Executa a compilacao
          make -j$(nproc) O=out

      - name: Compactar e Salvar o Resultado
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-MotoG8-rav
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img
