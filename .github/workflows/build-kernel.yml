name: Build Moto G8 Kernel

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Defconfig target"
        required: true
        default: "vendor/trinket-perf_defconfig"

env:
  KBUILD_BUILD_USER: "@ravindu644"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tag Oficial Stock ROM
        uses: actions/checkout@v4
        with:
          repository: 'MotorolaMobilityLLC/kernel-msm'
          ref: 'MMI-RPJS31.Q4U-47-35-17'
          submodules: recursive

      - name: Install dependencies (non-interactive)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            device-tree-compiler lz4 xz-utils zlib1g-dev openjdk-17-jdk \
            gcc g++ python3 python-is-python3 p7zip-full \
            android-sdk-libsparse-utils erofs-utils flex bison gperf \
            build-essential zip curl libc6-dev libncurses-dev libx11-dev \
            libreadline-dev libgl1 libgl1-mesa-dev make bc grep tofrodos \
            python3-markdown libxml2-utils xsltproc libtinfo6 cpio kmod \
            openssl libelf-dev pahole libssl-dev libarchive-tools zstd \
            libyaml-dev
          wget -q http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb \
            && sudo dpkg -i libtinfo5_6.3-2ubuntu0.1_amd64.deb || true

      - name: Cache toolchains
        id: cache-toolchains
        uses: actions/cache@v4
        with:
          path: ~/toolchains
          key: toolchains-clang-r383902b-gcc-4.9-v1

      - name: Download toolchains
        if: steps.cache-toolchains.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchains/clang-r383902b
          curl -L -o /tmp/clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/0e9e7035bf8ad42437c6156e5950eab13655b26c/clang-r383902b.tar.gz"
          tar -xf /tmp/clang.tar.gz -C ~/toolchains/clang-r383902b
          rm /tmp/clang.tar.gz

          mkdir -p ~/toolchains/gcc64
          curl -L -o /tmp/gcc64.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/android-10.0.0_r47.tar.gz"
          tar -xf /tmp/gcc64.tar.gz -C ~/toolchains/gcc64
          rm /tmp/gcc64.tar.gz

      - name: Build kernel
        run: |
          set -e
          export ARCH=arm64
          export KERNEL_ROOT="$(pwd)"
          export PATH="${HOME}/toolchains/clang-r383902b/bin:${HOME}/toolchains/gcc64/bin:${PATH}"
          export LD_LIBRARY_PATH="${HOME}/toolchains/clang-r383902b/lib:${HOME}/toolchains/clang-r383902b/lib64:${LD_LIBRARY_PATH}"

          BUILD_OPTIONS=(
            HOSTLDLIBS="-lyaml"
            -C "${KERNEL_ROOT}"
            O="${KERNEL_ROOT}/out"
            -j"$(nproc)"
            ARCH=arm64
            CROSS_COMPILE=aarch64-linux-android-
            CC=clang
            CLANG_TRIPLE=aarch64-linux-gnu-
            KCFLAGS="-fno-pic"
          )

          mkdir -p "${KERNEL_ROOT}/out" "${KERNEL_ROOT}/build"

          # Carrega a defconfig nativa
          make "${BUILD_OPTIONS[@]}" "${{ github.event.inputs.defconfig }}"
          make "${BUILD_OPTIONS[@]}" olddefconfig

          # Compila a imagem principal
          make "${BUILD_OPTIONS[@]}" Image.gz-dtb dtbo.img || make "${BUILD_OPTIONS[@]}" Image.gz

          cp -v "${KERNEL_ROOT}/out/arch/arm64/boot/Image.gz-dtb" "${KERNEL_ROOT}/build/" || cp -v "${KERNEL_ROOT}/out/arch/arm64/boot/Image.gz" "${KERNEL_ROOT}/build/"
          [ -f "${KERNEL_ROOT}/out/arch/arm64/boot/dtbo.img" ] && cp -v "${KERNEL_ROOT}/out/arch/arm64/boot/dtbo.img" "${KERNEL_ROOT}/build/" || true

      - name: Upload Image artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-MotoG8-Artifacts
          path: build/*
