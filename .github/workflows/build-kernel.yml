name: Build Moto G8 (rav) Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar o Código-Fonte
        uses: actions/checkout@v4

      - name: Instalar Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libssl-dev libncurses5-dev bison flex libelf-dev libzip-dev git wget

      - name: Baixar Toolchains do Android AOSP (GCC 4.9)
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchain64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 toolchain32

      - name: Ignorar gcc-wrapper incompatível
        run: |
          if [ -f scripts/gcc-wrapper.py ]; then
            echo '#!/bin/bash' > scripts/gcc-wrapper.py
            echo 'exec "$@"' >> scripts/gcc-wrapper.py
            chmod +x scripts/gcc-wrapper.py
          fi

      - name: Configurar e Compilar o Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$(pwd)/toolchain64/bin:$(pwd)/toolchain32/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export KCFLAGS="-w"

          # 1. Configura para trinket (Snapdragon 665)
          make O=out vendor/trinket-perf_defconfig

          # 2. Aplica a config do Moto G8 (rav)
          if [ -f arch/arm64/configs/vendor/ext_config/moto-trinket-rav.config ]; then
            scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/ext_config/moto-trinket-rav.config
            make O=out olddefconfig
          fi

          # 3. Compila
          make -j$(nproc) O=out

      - name: Compactar e Salvar o Resultado
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-MotoG8-rav
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img
            scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/ext_config/moto-trinket-rav.config
            make O=out olddefconfig
          fi

          # 3. Compila o Kernel
          make -j$(nproc) O=out

      - name: Compactar e Salvar o Resultado
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-MotoG8-rav
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img
          make O=out vendor/trinket-perf_defconfig

          # 2. Aplica a config do Moto G8 (rav)
          scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/ext_config/moto-trinket-rav.config
          make O=out olddefconfig

          # 3. Compila os binários
          make -j$(nproc) O=out

      - name: Compactar e Salvar o Resultado
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-MotoG8-rav
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img
          make O=out vendor/trinket-perf_defconfig

          # 2. Aplica a config do Moto G8 (rav)
          scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/ext_config/moto-trinket-rav.config
          make O=out olddefconfig

          # 3. Compila os binários
          make -j$(nproc) O=out

      - name: Compactar e Salvar o Resultado
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-MotoG8-rav
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img
          make O=out olddefconfig

          # 3. Compila os binários ignorando o gcc-wrapper se necessário
          make -j$(nproc) O=out

      - name: Compactar e Salvar o Resultado
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-MotoG8-rav
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img
