name: Build Moto G8 (rav) Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - name: Baixar o Código-Fonte
        uses: actions/checkout@v3
        with:
          ref: 'MMI-RPJS31.Q4U-47-35-17'

      - name: Instalar Dependências e Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libssl-dev libncurses5-dev bison flex libelf-dev libzip-dev clang gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Configurar e Compilar o Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out vendor/rav_defconfig
          make -j$(nproc) O=out

      - name: Compactar e Salvar o Resultado
        uses: actions/upload-artifact@v3
        with:
          name: Kernel-MotoG8-rav
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img
