name: Build Moto G8 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar o Codigo-Fonte
        uses: actions/checkout@v4
        with:
          repository: 'MotorolaMobilityLLC/kernel-msm'
          ref: 'MMI-RPJS31.Q4U-47-35-17'

      - name: Instalar Dependencias e Compiladores
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libssl-dev libncurses5-dev bison flex libelf-dev libzip-dev git python3 python-is-python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Corrigir o gcc-wrapper para Python 3
        run: |
          if [ -f scripts/gcc-wrapper.py ]; then
            rm -f scripts/gcc-wrapper.py
          fi
          echo 'import sys' > scripts/gcc-wrapper.py
          echo 'import subprocess' >> scripts/gcc-wrapper.py
          echo 'cmd = sys.argv[1:]' >> scripts/gcc-wrapper.py
          echo 'sys.exit(subprocess.call(cmd))' >> scripts/gcc-wrapper.py
          chmod +x scripts/gcc-wrapper.py

      - name: Ajustar Flags de Erro no Makefile
        run: |
          find . -name "Makefile" -o -name "Kbuild" | xargs sed -i 's/-Werror//g'

      - name: Configurar e Compilar o Kernel com GCC
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          export KCFLAGS="-w -Wno-error"
          export HOSTCFLAGS="-Wno-error"

          CONFIG_TARGET="vendor/trinket-perf_defconfig"
          if [ ! -f "arch/arm64/configs/$CONFIG_TARGET" ]; then
            CONFIG_TARGET="trinket-perf_defconfig"
          fi

          echo "Usando o arquivo de configuracao: arch/arm64/configs/$CONFIG_TARGET"

          # 1. Gerar o .config base no diretório out/
          make O=out CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- "$CONFIG_TARGET"

          # 2. Desativar o stack protector estrito no .config gerado para evitar o erro do compilador
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' out/.config
          sed -i 's/CONFIG_CC_STACKPROTECTOR_AUTO=y/# CONFIG_CC_STACKPROTECTOR_AUTO is not set/' out/.config
          sed -i 's/CONFIG_STACKPROTECTOR=y/# CONFIG_STACKPROTECTOR is not set/' out/.config
          sed -i 's/CONFIG_STACKPROTECTOR_STRONG=y/# CONFIG_STACKPROTECTOR_STRONG is not set/' out/.config

          # 3. Compilar o Kernel sem travamentos de stack protector
          make -j$(nproc) O=out CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Compactar e Salvar o Resultado
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-MotoG8-rav
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img
